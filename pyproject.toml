[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brad"
version = "0.0.1"
authors = [
    {name = "JF Pascoal"},
]
description = ""
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "psycopg[binary]~=3.3",
    "pandas~=2.3",
    "odfpy~=1.4",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "click>=8.0",
    "cryptography>=46.0",
    "streamlit>=1.33"
]

[project.scripts]
brad = "brad.cli:cli"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*directory.*run.*secrets.*does not exist:UserWarning",
]
